<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超新星・見證資料庫</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: #2e2e2e;
    --accent: #c8a96e;
    --accent2: #e8c98e;
    --text: #e8e4dc;
    --text2: #8a8480;
    --text3: #5a5654;
    --green: #4a9e6a;
    --red: #c0504a;
    --tag-bg: #2a2520;
    --tag-text: #c8a96e;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  /* ── SETUP SCREEN ── */
  #setup-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .setup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 32px;
    width: 100%;
    max-width: 440px;
  }
  .setup-card h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .setup-card p { color: var(--text2); font-size: 14px; margin-bottom: 28px; }

  /* ── LOGIN SCREEN ── */
  #login-screen {
    display: none;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 32px;
    width: 100%;
    max-width: 380px;
  }
  .login-card h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 20px;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .login-card p { color: var(--text2); font-size: 13px; margin-bottom: 28px; }

  /* ── MAIN APP ── */
  #app { display: none; flex-direction: column; min-height: 100vh; }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--accent);
  }
  .header-subtitle { font-size: 12px; color: var(--text3); }
  .header-actions { display: flex; align-items: center; gap: 10px; }

  /* Tabs */
  .tabs {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    padding: 0 20px;
    gap: 4px;
  }
  .tab {
    padding: 12px 16px;
    font-size: 14px;
    color: var(--text2);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Content area */
  .content { flex: 1; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }

  /* ── ADD FORM ── */
  .add-form { display: flex; flex-direction: column; gap: 16px; }

  .form-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .form-section-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 500;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .form-section-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }

  .field-label {
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 6px;
    display: block;
  }
  .field-label span { color: var(--accent); }

  input, textarea, select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 15px;
    font-weight: 300;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 120px; line-height: 1.7; }
  select option { background: var(--surface2); }

  /* AI parse area */
  .ai-input-area {
    background: var(--surface2);
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .ai-input-area textarea {
    background: transparent;
    border: none;
    padding: 0;
    font-size: 14px;
    min-height: 80px;
  }
  .ai-input-area textarea:focus { border: none; }

  .ai-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Photo upload */
  .photo-upload-area {
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }
  .photo-upload-area:hover { border-color: var(--accent); background: #1e1c18; }
  .photo-upload-area input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
    width: 100%; height: 100%; padding: 0; border: none; background: none;
  }
  .photo-upload-icon { font-size: 28px; margin-bottom: 8px; }
  .photo-upload-text { font-size: 13px; color: var(--text2); }
  .photo-upload-sub { font-size: 12px; color: var(--text3); margin-top: 4px; }

  .photo-preview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px;
    margin-top: 12px;
  }
  .photo-preview-item {
    position: relative;
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: var(--surface2);
  }
  .photo-preview-item img { width: 100%; height: 100%; object-fit: cover; }
  .photo-preview-item .remove-photo {
    position: absolute; top: 4px; right: 4px;
    background: rgba(0,0,0,0.7);
    color: white; border: none; border-radius: 50%;
    width: 22px; height: 22px; font-size: 12px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .photo-uploading {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: white;
  }

  /* Tags input */
  .tags-container {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    min-height: 46px;
    cursor: text;
  }
  .tags-container:focus-within { border-color: var(--accent); }
  .tag-chip {
    background: var(--tag-bg);
    color: var(--tag-text);
    border: 1px solid #3a3020;
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .tag-chip button {
    background: none; border: none; color: var(--text3);
    cursor: pointer; font-size: 14px; padding: 0;
    line-height: 1; width: auto;
  }
  .tag-input {
    border: none; background: none; color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px; padding: 0; min-width: 80px; flex: 1;
    outline: none; width: auto;
  }

  /* Suggested tags */
  .suggested-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .suggested-tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .suggested-tag:hover { border-color: var(--accent); color: var(--accent); }

  /* Row layout */
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .field-row { grid-template-columns: 1fr; } }

  /* Buttons */
  .btn {
    padding: 12px 20px;
    border-radius: var(--radius-sm);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--accent);
    color: #0f0f0f;
  }
  .btn-primary:hover { background: var(--accent2); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost {
    background: var(--surface2);
    color: var(--text2);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm { padding: 8px 14px; font-size: 13px; }
  .btn-icon {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .btn-icon:hover { border-color: var(--accent); color: var(--accent); }

  .form-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    padding-top: 4px;
  }

  /* ── LIST VIEW ── */
  .list-toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-box {
    flex: 1;
    min-width: 180px;
    position: relative;
  }
  .search-box input {
    padding-left: 36px;
    font-size: 14px;
  }
  .search-box::before {
    content: '🔍';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    z-index: 1;
  }

  .filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-pill {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-pill.active { background: var(--tag-bg); border-color: var(--accent); color: var(--accent); }

  /* Cards */
  .cards-grid { display: flex; flex-direction: column; gap: 12px; }

  .testimony-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s;
    cursor: pointer;
  }
  .testimony-card:hover { border-color: #3e3a30; }
  .testimony-card.expanded { border-color: var(--accent); }

  .card-header {
    padding: 16px 18px 14px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .card-meta { display: flex; flex-direction: column; gap: 4px; }
  .card-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }
  .card-product {
    font-size: 12px;
    color: var(--accent);
  }
  .card-date { font-size: 12px; color: var(--text3); }

  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 18px 12px; }
  .card-tag {
    background: var(--tag-bg);
    color: var(--tag-text);
    border-radius: 20px;
    padding: 2px 9px;
    font-size: 12px;
  }

  .card-preview {
    padding: 0 18px 16px;
    font-size: 14px;
    color: var(--text2);
    line-height: 1.7;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-expanded { display: none; border-top: 1px solid var(--border); }
  .testimony-card.expanded .card-expanded { display: block; }

  .card-photos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 4px;
    padding: 14px 18px 0;
  }
  .card-photo {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    overflow: hidden;
    cursor: pointer;
  }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; }

  .card-full-text {
    padding: 14px 18px;
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
  }

  .card-ai-version {
    margin: 0 18px 14px;
    background: #1a1e16;
    border: 1px solid #2a3020;
    border-radius: var(--radius-sm);
    padding: 12px 14px;
  }
  .card-ai-label {
    font-size: 11px;
    color: var(--green);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .card-ai-text { font-size: 13px; color: var(--text2); line-height: 1.7; }

  .card-actions {
    padding: 12px 18px;
    display: flex;
    gap: 8px;
    border-top: 1px solid var(--border);
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
  }
  .empty-state-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state-text { font-size: 15px; margin-bottom: 6px; color: var(--text2); }
  .empty-state-sub { font-size: 13px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 12px 20px;
    font-size: 14px;
    color: var(--text);
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error { border-color: var(--red); color: var(--red); }

  /* Loading spinner */
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Settings modal */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-family: 'Noto Serif TC', serif;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 20px;
  }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* Image lightbox */
  .lightbox {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 300;
    align-items: center;
    justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 95vw; max-height: 90vh; object-fit: contain; border-radius: 8px; }
  .lightbox-close {
    position: absolute; top: 20px; right: 20px;
    background: rgba(255,255,255,0.1);
    border: none; color: white;
    width: 40px; height: 40px; border-radius: 50%;
    font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 16px;
    padding: 12px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .stat-item { display: flex; flex-direction: column; gap: 2px; }
  .stat-num { font-size: 20px; font-weight: 600; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--text3); }

  /* AI status indicator */
  .ai-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    border: 1px solid;
  }
  .ai-badge.on { color: var(--green); border-color: #2a4a30; background: #0f1f10; }
  .ai-badge.off { color: var(--text3); border-color: var(--border); background: var(--surface2); }
  .ai-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .field-hint { font-size: 12px; color: var(--text3); margin-top: 4px; }
</style>
</head>
<body>

<!-- Setup Screen -->
<div id="setup-screen">
  <div class="setup-card">
    <h1>超新星・見證資料庫</h1>
    <p>初次設定：請輸入 Google Apps Script 部署網址</p>
    <label class="field-label">Apps Script 部署 URL</label>
    <input type="url" id="setup-url" placeholder="https://script.google.com/macros/s/..." style="margin-bottom:16px">
    <button class="btn btn-primary" style="width:100%" onclick="saveSetup()">確認儲存並進入</button>
  </div>
</div>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-card">
    <h1>超新星・見證資料庫</h1>
    <p>請登入以繼續使用</p>
    <label class="field-label">Email</label>
    <input type="email" id="login-email" style="margin-bottom:12px" placeholder="your@email.com">
    <label class="field-label">密碼</label>
    <input type="password" id="login-password" style="margin-bottom:20px">
    <button class="btn btn-primary" style="width:100%" onclick="doLogin()">登入</button>
  </div>
</div>

<!-- Main App -->
<div id="app">
  <div class="header">
    <div class="header-left">
      <div>
        <h1>見證資料庫</h1>
        <div class="header-subtitle" id="ai-status-badge"></div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" onclick="openSettings()" title="設定">⚙️</button>
      <button class="btn-icon" onclick="doLogout()" title="登出">🚪</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('list')">📋 見證列表</div>
    <div class="tab" onclick="switchTab('add')">➕ 新增見證</div>
  </div>

  <!-- List Tab -->
  <div id="tab-list" class="content">
    <div class="stats-bar" id="stats-bar" style="display:none">
      <div class="stat-item">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-label">筆見證</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="stat-with-photo">0</div>
        <div class="stat-label">附照片</div>
      </div>
    </div>

    <div class="list-toolbar">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="搜尋姓名、內容、標籤..." oninput="filterList()">
      </div>
      <button class="btn btn-ghost btn-sm" onclick="loadTestimonies()">🔄</button>
    </div>

    <div class="filter-pills" id="filter-pills" style="margin-bottom:14px"></div>

    <div class="cards-grid" id="cards-grid">
      <div class="empty-state">
        <div class="spinner"></div>
        <div class="empty-state-text" style="margin-top:16px">載入中...</div>
      </div>
    </div>
  </div>

  <!-- Add Tab -->
  <div id="tab-add" class="content" style="display:none">
    <div class="add-form">

      <!-- AI Parse Section -->
      <div class="form-section">
        <div class="form-section-header">
          ✨ 快速輸入（貼文字，AI自動拆解）
        </div>
        <div class="form-section-body">
          <div class="ai-input-area">
            <textarea id="ai-raw-input" placeholder="把見證文字貼在這裡，或直接手動填寫下方欄位&#10;&#10;例如：「我睡眠一直不好，用了妮芙露的寢具兩週後，每天都睡得很熟，精神變好很多！」"></textarea>
          </div>
          <div class="ai-actions">
            <button class="btn btn-primary btn-sm" id="btn-ai-parse" onclick="aiParse()">
              ✨ AI 自動拆解
            </button>
            <button class="btn btn-ghost btn-sm" onclick="clearAiInput()">清除</button>
          </div>
          <div class="field-hint" id="ai-hint">設定 API Key 後可啟用 AI 自動拆解功能</div>
        </div>
      </div>

      <!-- Basic Info -->
      <div class="form-section">
        <div class="form-section-header">📝 見證資訊</div>
        <div class="form-section-body">
          <div class="field-row">
            <div>
              <label class="field-label">見證人暱稱／姓名</label>
              <input type="text" id="f-name" placeholder="例：小林媽媽">
            </div>
            <div>
              <label class="field-label">見證日期</label>
              <input type="date" id="f-date">
            </div>
          </div>

          <div>
            <label class="field-label">使用產品</label>
            <input type="text" id="f-product" placeholder="例：遠紅外線寢具組、負離子衣">
          </div>

          <div>
            <label class="field-label">原始內容 <span>*</span></label>
            <textarea id="f-content" placeholder="見證的完整原文"></textarea>
          </div>

          <div>
            <label class="field-label">整理版（AI生成，可修改）</label>
            <textarea id="f-summary" placeholder="簡短摘要版本，方便快速分享" style="min-height:80px"></textarea>
          </div>

          <div>
            <label class="field-label">關鍵字標籤</label>
            <div class="tags-container" id="tags-container" onclick="document.getElementById('tag-input').focus()">
              <input type="text" id="tag-input" class="tag-input" placeholder="輸入後按 Enter 新增" onkeydown="handleTagInput(event)">
            </div>
            <div class="suggested-tags" id="suggested-tags"></div>
          </div>

          <div>
            <label class="field-label">來源</label>
            <select id="f-source">
              <option value="">選擇來源</option>
              <option value="FB貼文">FB 貼文</option>
              <option value="FB私訊">FB 私訊</option>
              <option value="Line訊息">Line 訊息</option>
              <option value="口頭分享">口頭分享</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div>
            <label class="field-label">備註</label>
            <input type="text" id="f-note" placeholder="其他補充資訊">
          </div>
        </div>
      </div>

      <!-- Photo Upload -->
      <div class="form-section">
        <div class="form-section-header">📷 照片上傳</div>
        <div class="form-section-body">
          <div class="photo-upload-area" id="photo-upload-area">
            <input type="file" accept="image/*" multiple id="photo-input" onchange="handlePhotoSelect(event)">
            <div class="photo-upload-icon">📷</div>
            <div class="photo-upload-text">點擊選擇照片</div>
            <div class="photo-upload-sub">支援多張，JPG / PNG</div>
          </div>
          <div class="photo-preview-grid" id="photo-preview-grid"></div>
          <div class="field-hint" id="photo-hint">照片將上傳至 Google 雲端硬碟，需在設定中授權</div>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-ghost" onclick="clearForm()">清除</button>
        <button class="btn btn-primary" id="btn-save" onclick="saveTestimony()">
          儲存見證
        </button>
      </div>

    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <h2>⚙️ 設定</h2>

    <label class="field-label">Apps Script 部署 URL</label>
    <input type="url" id="settings-url" style="margin-bottom:16px">

    <label class="field-label">Claude API Key（選填）</label>
    <input type="password" id="settings-apikey" placeholder="sk-ant-..." style="margin-bottom:6px">
    <div class="field-hint" style="margin-bottom:16px">設定後可啟用 AI 自動拆解見證文字功能</div>

    <label class="field-label">Google Drive 資料夾 ID（選填）</label>
    <input type="text" id="settings-folder" placeholder="從雲端硬碟資料夾連結複製ID" style="margin-bottom:6px">
    <div class="field-hint" style="margin-bottom:4px">雲端硬碟網址中 /folders/ 後面那段即為 ID</div>
    <div class="field-hint" style="margin-bottom:16px">未設定則使用 Apps Script 根目錄</div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeSettings()">取消</button>
      <button class="btn btn-primary" onclick="saveSettings()">儲存設定</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──
const CONFIG_KEY = 'nsm_testimony_config';
const TAGS_PRESET = ['睡眠', '疼痛', '皮膚', '精神', '過敏', '循環', '體力', '情緒', '消化', '免疫'];

let config = {};
let allTestimonies = [];
let currentTags = [];
let selectedPhotos = [];
let activeFilter = '';
let expandedCard = null;

// ── INIT ──
window.onload = () => {
  config = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}');
  if (!config.scriptUrl) {
    document.getElementById('setup-screen').style.display = 'flex';
  } else if (!config.token) {
    showLoginScreen();
  } else {
    showApp();
  }
  // Set today's date
  document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
};

// ── SETUP ──
function saveSetup() {
  const url = document.getElementById('setup-url').value.trim();
  if (!url) return showToast('請輸入 Apps Script URL', 'error');
  config.scriptUrl = url;
  localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
  document.getElementById('setup-screen').style.display = 'none';
  showLoginScreen();
}

// ── LOGIN ──
function showLoginScreen() {
  document.getElementById('login-screen').style.display = 'flex';
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) return showToast('請輸入帳號和密碼', 'error');
  try {
    const res = await apiCall({ action: 'login', email, password });
    if (res.success) {
      config.token = res.token;
      config.userName = res.name || email;
      localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
      document.getElementById('login-screen').style.display = 'none';
      showApp();
    } else {
      showToast(res.message || '登入失敗', 'error');
    }
  } catch(e) {
    showToast('連線失敗，請確認網址正確', 'error');
  }
}

function doLogout() {
  config.token = null;
  localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
  document.getElementById('app').style.display = 'none';
  showLoginScreen();
}

// ── APP ──
function showApp() {
  document.getElementById('app').style.display = 'flex';
  updateAiBadge();
  initSuggestedTags();
  loadTestimonies();
}

function updateAiBadge() {
  const badge = document.getElementById('ai-status-badge');
  const hint = document.getElementById('ai-hint');
  if (config.apiKey) {
    badge.innerHTML = `<span class="ai-badge on"><span class="ai-dot"></span>AI 已啟用</span>`;
    hint.textContent = 'AI 將自動拆解見證內容並萃取關鍵資訊';
  } else {
    badge.innerHTML = `<span class="ai-badge off"><span class="ai-dot"></span>手動模式</span>`;
    hint.textContent = '在設定中填入 API Key 可啟用 AI 自動拆解功能';
  }
}

// ── TABS ──
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='list')||(i===1&&tab==='add')));
  document.getElementById('tab-list').style.display = tab === 'list' ? 'block' : 'none';
  document.getElementById('tab-add').style.display = tab === 'add' ? 'block' : 'none';
}

// ── LOAD TESTIMONIES ──
async function loadTestimonies() {
  try {
    const res = await apiCall({ action: 'getTestimonies', token: config.token });
    if (res.success) {
      allTestimonies = res.data || [];
      renderList(allTestimonies);
      updateStats();
      buildFilterPills();
    }
  } catch(e) {
    document.getElementById('cards-grid').innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">載入失敗</div></div>`;
  }
}

function updateStats() {
  const total = allTestimonies.length;
  const withPhoto = allTestimonies.filter(t => t.photos && t.photos.length > 0).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-with-photo').textContent = withPhoto;
  document.getElementById('stats-bar').style.display = total > 0 ? 'flex' : 'none';
}

function buildFilterPills() {
  const tagCounts = {};
  allTestimonies.forEach(t => {
    (t.tags || []).forEach(tag => { tagCounts[tag] = (tagCounts[tag]||0)+1; });
  });
  const sorted = Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const container = document.getElementById('filter-pills');
  container.innerHTML = sorted.map(([tag,count]) =>
    `<div class="filter-pill ${activeFilter===tag?'active':''}" onclick="setFilter('${tag}')">${tag} <span style="opacity:0.6">${count}</span></div>`
  ).join('');
}

function setFilter(tag) {
  activeFilter = activeFilter === tag ? '' : tag;
  buildFilterPills();
  filterList();
}

function filterList() {
  const q = document.getElementById('search-input').value.toLowerCase();
  let filtered = allTestimonies;
  if (activeFilter) filtered = filtered.filter(t => (t.tags||[]).includes(activeFilter));
  if (q) filtered = filtered.filter(t =>
    (t.name||'').toLowerCase().includes(q) ||
    (t.content||'').toLowerCase().includes(q) ||
    (t.summary||'').toLowerCase().includes(q) ||
    (t.tags||[]).some(tag => tag.toLowerCase().includes(q))
  );
  renderList(filtered);
}

function renderList(items) {
  const grid = document.getElementById('cards-grid');
  if (!items.length) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-state-icon">💬</div><div class="empty-state-text">還沒有見證</div><div class="empty-state-sub">點「新增見證」開始記錄</div></div>`;
    return;
  }
  grid.innerHTML = items.map((t,i) => renderCard(t, i)).join('');
}

function renderCard(t, i) {
  const photos = t.photos || [];
  const tags = t.tags || [];
  const previewText = (t.summary || t.content || '').substring(0, 80);
  return `
  <div class="testimony-card" id="card-${t.id}" onclick="toggleCard('${t.id}')">
    <div class="card-header">
      <div class="card-meta">
        <div class="card-name">${t.name || '（未命名）'}</div>
        ${t.product ? `<div class="card-product">📦 ${t.product}</div>` : ''}
        <div class="card-date">${t.date || ''} ${t.source ? '・'+t.source : ''}</div>
      </div>
      ${photos.length ? `<div style="font-size:18px">📷</div>` : ''}
    </div>
    ${tags.length ? `<div class="card-tags">${tags.map(tag=>`<span class="card-tag">${tag}</span>`).join('')}</div>` : ''}
    <div class="card-preview">${previewText}${previewText.length>=80?'...':''}</div>

    <div class="card-expanded">
      ${photos.length ? `<div class="card-photos">${photos.map(p=>`<div class="card-photo" onclick="openLightbox('${p}');event.stopPropagation()"><img src="${p}" alt="見證照片" loading="lazy"></div>`).join('')}</div>` : ''}
      ${t.summary && t.content !== t.summary ? `
        <div class="card-ai-version">
          <div class="card-ai-label">✨ 整理版</div>
          <div class="card-ai-text">${t.summary}</div>
        </div>` : ''}
      <div class="card-full-text">${t.content || ''}</div>
      <div class="card-actions">
        <button class="btn btn-ghost btn-sm" onclick="copyText(event, '${(t.summary||t.content||'').replace(/'/g,"\\'")}')">📋 複製分享</button>
        <button class="btn btn-ghost btn-sm" onclick="deleteTestimony(event, '${t.id}')">🗑️ 刪除</button>
      </div>
    </div>
  </div>`;
}

function toggleCard(id) {
  const card = document.getElementById('card-'+id);
  if (!card) return;
  const wasExpanded = card.classList.contains('expanded');
  document.querySelectorAll('.testimony-card.expanded').forEach(c => c.classList.remove('expanded'));
  if (!wasExpanded) card.classList.add('expanded');
}

async function copyText(e, text) {
  e.stopPropagation();
  await navigator.clipboard.writeText(text);
  showToast('已複製！', 'success');
}

async function deleteTestimony(e, id) {
  e.stopPropagation();
  if (!confirm('確定要刪除這筆見證嗎？')) return;
  const res = await apiCall({ action: 'deleteTestimony', token: config.token, id });
  if (res.success) {
    showToast('已刪除', 'success');
    loadTestimonies();
  }
}

// ── AI PARSE ──
async function aiParse() {
  const raw = document.getElementById('ai-raw-input').value.trim();
  if (!raw) return showToast('請先貼上見證文字', 'error');
  if (!config.apiKey) {
    // Manual mode: just fill content field
    document.getElementById('f-content').value = raw;
    switchTab('add');
    showToast('已填入原始內容，請手動補充其他欄位', 'success');
    return;
  }
  const btn = document.getElementById('btn-ai-parse');
  btn.innerHTML = '<span class="spinner"></span>';
  btn.disabled = true;
  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': config.apiKey, 'anthropic-version': '2023-06-01' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: `以下是一段健康產品見證文字，請幫我萃取關鍵資訊，以 JSON 格式回覆，只回 JSON 不要其他文字：
{
  "name": "見證人姓名或暱稱，沒有就填空字串",
  "product": "提到的產品名稱，沒有就填空字串",
  "tags": ["最多5個關鍵字標籤，如：睡眠、疼痛、皮膚、精神、過敏、循環、體力、情緒、消化、免疫"],
  "summary": "用第三人稱寫一句簡短摘要，50字以內，方便分享給潛在客戶看"
}

見證內容：
${raw}`
        }]
      })
    });
    const data = await response.json();
    const text = data.content[0].text;
    const parsed = JSON.parse(text.replace(/```json|```/g,'').trim());
    if (parsed.name) document.getElementById('f-name').value = parsed.name;
    if (parsed.product) document.getElementById('f-product').value = parsed.product;
    if (parsed.summary) document.getElementById('f-summary').value = parsed.summary;
    document.getElementById('f-content').value = raw;
    if (parsed.tags) { currentTags = []; renderTags(); parsed.tags.forEach(addTag); }
    switchTab('add');
    showToast('AI 拆解完成，請確認後儲存', 'success');
  } catch(e) {
    showToast('AI 解析失敗，已填入原始內容', 'error');
    document.getElementById('f-content').value = raw;
    switchTab('add');
  } finally {
    btn.innerHTML = '✨ AI 自動拆解';
    btn.disabled = false;
  }
}

function clearAiInput() {
  document.getElementById('ai-raw-input').value = '';
}

// ── TAGS ──
function initSuggestedTags() {
  document.getElementById('suggested-tags').innerHTML =
    TAGS_PRESET.map(t => `<div class="suggested-tag" onclick="addTag('${t}')">${t}</div>`).join('');
}

function handleTagInput(e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = document.getElementById('tag-input').value.trim();
    if (val) { addTag(val); document.getElementById('tag-input').value = ''; }
  } else if (e.key === 'Backspace' && !document.getElementById('tag-input').value && currentTags.length) {
    currentTags.pop(); renderTags();
  }
}

function addTag(tag) {
  tag = tag.trim();
  if (!tag || currentTags.includes(tag)) return;
  currentTags.push(tag);
  renderTags();
}

function removeTag(tag) {
  currentTags = currentTags.filter(t => t !== tag);
  renderTags();
}

function renderTags() {
  const container = document.getElementById('tags-container');
  const input = document.getElementById('tag-input');
  container.innerHTML = '';
  currentTags.forEach(tag => {
    const chip = document.createElement('div');
    chip.className = 'tag-chip';
    chip.innerHTML = `${tag}<button onclick="removeTag('${tag}')">×</button>`;
    container.appendChild(chip);
  });
  container.appendChild(input);
  input.focus();
}

// ── PHOTO UPLOAD ──
function handlePhotoSelect(e) {
  const files = Array.from(e.target.files);
  files.forEach(file => {
    if (!selectedPhotos.find(p => p.name === file.name)) {
      selectedPhotos.push(file);
    }
  });
  renderPhotoPreview();
}

function renderPhotoPreview() {
  const grid = document.getElementById('photo-preview-grid');
  grid.innerHTML = selectedPhotos.map((file, i) => {
    const url = URL.createObjectURL(file);
    return `<div class="photo-preview-item">
      <img src="${url}" alt="">
      <button class="remove-photo" onclick="removePhoto(${i})">×</button>
    </div>`;
  }).join('');
}

function removePhoto(i) {
  selectedPhotos.splice(i, 1);
  renderPhotoPreview();
}

async function uploadPhotos() {
  if (!selectedPhotos.length) return [];
  const photoUrls = [];
  const grid = document.getElementById('photo-preview-grid');
  const items = grid.querySelectorAll('.photo-preview-item');

  for (let i = 0; i < selectedPhotos.length; i++) {
    const file = selectedPhotos[i];
    const item = items[i];
    if (item) item.innerHTML += `<div class="photo-uploading">上傳中...</div>`;

    const base64 = await fileToBase64(file);
    const name = document.getElementById('f-name').value || '見證';
    const date = document.getElementById('f-date').value || new Date().toISOString().split('T')[0];
    const tags = currentTags.join('-') || '未分類';
    const fileName = `${date}_${name}_${tags}_${i+1}.jpg`;

    try {
      const res = await apiCall({
        action: 'uploadPhoto',
        token: config.token,
        fileName,
        base64,
        mimeType: file.type,
        folderId: config.folderId || ''
      });
      if (res.url) photoUrls.push(res.url);
    } catch(e) {
      console.error('Photo upload failed', e);
    }
  }
  return photoUrls;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ── SAVE ──
async function saveTestimony() {
  const content = document.getElementById('f-content').value.trim();
  if (!content) return showToast('請填入見證內容', 'error');

  const btn = document.getElementById('btn-save');
  btn.innerHTML = '<span class="spinner"></span> 儲存中...';
  btn.disabled = true;

  try {
    // Upload photos first
    const photoUrls = await uploadPhotos();

    const data = {
      action: 'addTestimony',
      token: config.token,
      name: document.getElementById('f-name').value.trim(),
      date: document.getElementById('f-date').value,
      product: document.getElementById('f-product').value.trim(),
      content,
      summary: document.getElementById('f-summary').value.trim(),
      tags: currentTags,
      source: document.getElementById('f-source').value,
      note: document.getElementById('f-note').value.trim(),
      photos: photoUrls
    };

    const res = await apiCall(data);
    if (res.success) {
      showToast('見證已儲存！', 'success');
      clearForm();
      switchTab('list');
      loadTestimonies();
    } else {
      showToast(res.message || '儲存失敗', 'error');
    }
  } catch(e) {
    showToast('儲存失敗，請再試一次', 'error');
  } finally {
    btn.innerHTML = '儲存見證';
    btn.disabled = false;
  }
}

function clearForm() {
  document.getElementById('f-name').value = '';
  document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('f-product').value = '';
  document.getElementById('f-content').value = '';
  document.getElementById('f-summary').value = '';
  document.getElementById('f-source').value = '';
  document.getElementById('f-note').value = '';
  document.getElementById('ai-raw-input').value = '';
  currentTags = []; renderTags();
  selectedPhotos = []; renderPhotoPreview();
}

// ── SETTINGS ──
function openSettings() {
  document.getElementById('settings-url').value = config.scriptUrl || '';
  document.getElementById('settings-apikey').value = config.apiKey || '';
  document.getElementById('settings-folder').value = config.folderId || '';
  document.getElementById('settings-modal').classList.add('open');
}
function closeSettings() { document.getElementById('settings-modal').classList.remove('open'); }
function saveSettings() {
  config.scriptUrl = document.getElementById('settings-url').value.trim();
  config.apiKey = document.getElementById('settings-apikey').value.trim();
  config.folderId = document.getElementById('settings-folder').value.trim();
  localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
  closeSettings();
  updateAiBadge();
  showToast('設定已儲存', 'success');
}

// ── LIGHTBOX ──
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }

// ── API CALL ──
async function apiCall(params) {
  const url = config.scriptUrl;
  if (!url) throw new Error('No script URL');
  const response = await fetch(url, {
    method: 'POST',
    body: JSON.stringify(params)
  });
  return await response.json();
}

// ── TOAST ──
function showToast(msg, type='') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (type ? ' '+type : '');
  setTimeout(() => { toast.className = 'toast'; }, 3000);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>超新星 負離子見證故事庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F2;--card:#FFFFFF;--ink:#2C2420;--sub:#7A6855;--line:#E2D5C3;
  --accent:#B8920A;--accent-soft:rgba(184,146,10,.12);--tag:#F5E6B8;--tagink:#5C4608;
  --ph1:#E2D5C3;--ph2:#F5F0E8;--vid-badge:#B54A3A;--biz-badge:#4F7A6A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1F1A17;--card:#2A2420;--ink:#F5F0E8;--sub:#B9A98F;--line:#4A3F36;
    --accent:#D4AD3C;--accent-soft:rgba(212,173,60,.16);--tag:#4A3D18;--tagink:#F5E6B8;
    --ph1:#3D3530;--ph2:#2C2420;--vid-badge:#D96B5A;--biz-badge:#6FA18E;color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --bg:#1F1A17;--card:#2A2420;--ink:#F5F0E8;--sub:#B9A98F;--line:#4A3F36;
  --accent:#D4AD3C;--accent-soft:rgba(212,173,60,.16);--tag:#4A3D18;--tagink:#F5E6B8;
  --ph1:#3D3530;--ph2:#2C2420;--vid-badge:#D96B5A;--biz-badge:#6FA18E;color-scheme:dark
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.75;transition:background .2s,color .2s}
button,input,textarea{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.wrap{max-width:1040px;margin:0 auto;padding:22px 20px 64px}

/* 1. 雜誌感 Hero 頂部區（融合兩站優點） */
.hero{background:linear-gradient(135deg,var(--tag),var(--card) 65%);border:1px solid var(--line);border-radius:24px;padding:30px 32px;margin-bottom:18px;box-shadow:0 6px 24px rgba(44,36,32,.04)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.eyebrow-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eyebrow{color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.12em}
.date-pill{background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;letter-spacing:.05em}
.hero h1{font-family:"Noto Serif TC","Songti TC",serif;font-size:clamp(26px,5vw,40px);margin:8px 0 6px;letter-spacing:.03em;line-height:1.25}
.lead{color:var(--sub);margin:0;max-width:680px;font-size:15px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat-pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:6px}

.theme-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.theme-btn:hover{border-color:var(--accent)}

/* 區塊卡片容器 */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 24px;margin:18px 0;box-shadow:0 4px 16px rgba(44,36,32,.03)}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sec-title-wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-badge{background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:6px;letter-spacing:.04em}
.st{font-size:19px;font-weight:900;margin:0;letter-spacing:.02em}
.hint{color:var(--sub);font-size:14px;margin:0 0 12px}
.smallbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 13px;font-size:13px;font-weight:700;cursor:pointer}
.smallbtn:hover{border-color:var(--accent)}
.lnk{background:none;border:0;color:var(--sub);text-decoration:underline;cursor:pointer;font-size:14px;padding:4px}

/* 2. 近期更新精選網格（支援圖片與影片縮圖） */
.recent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:14px}
.rcard{background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
.rcard:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 20px rgba(44,36,32,.08)}
.rcard-media{aspect-ratio:16/9;background:linear-gradient(135deg,var(--ph1),var(--ph2));position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px}
.rcard-media img{width:100%;height:100%;object-fit:cover;display:block}
.rcard-media.is-vid::after{content:"▶";position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(181,74,58,.9);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.rcard-body{padding:14px;display:flex;flex-direction:column;justify-content:space-between;flex:1}
.rcard-top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px}
.badge-new{background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px}
.rcard-date{font-size:12px;color:var(--sub)}
.rcard h4{margin:0 0 6px;font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard p{margin:0 0 10px;font-size:13px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard-tag{font-size:12px;color:var(--tagink);background:var(--tag);display:inline-block;padding:2px 9px;border-radius:6px;align-self:flex-start;font-weight:700}

/* 3. 熱門話題排行條（程風新竹數據亮點風格） */
.hot-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.hot-lbl{font-size:13px;font-weight:700;color:var(--sub)}
.hot-chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.hot-chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.hot-chip b{color:var(--accent)}

/* 4. 搜尋與雙層篩選器 */
#q{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:15px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.cat{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 13px;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:all .15s}
.cat:hover{border-color:var(--accent)}
.cat b{font-size:15px}.cat small{color:var(--sub);font-size:12px}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat[aria-pressed="true"] small{color:var(--bg)}
.pillrow{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 15px;font-size:14px;font-weight:600;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* 5. 內容類型頁籤（全部 / 健康見證 / 事業見證 / 影音精選） */
.typetabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:14px;margin:8px 0 18px}
.tt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:14px}
.tt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tt small{font-weight:400;opacity:.8;margin-left:5px}

/* 6. 影音精選專區（16:9 縮圖卡片牆） */
.vid-showcase{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:24px}
.vcard{background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.vcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.vthumb-box{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--ph1),var(--ph2));overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vthumb-box img{width:100%;height:100%;object-fit:cover;display:block}
.vplay-overlay{position:absolute;inset:0;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;transition:background .15s}
.vcard:hover .vplay-overlay{background:rgba(0,0,0,.4)}
.vplay-btn{width:48px;height:48px;border-radius:50%;background:var(--vid-badge);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.vplat-tag{position:absolute;top:10px;left:10px;background:rgba(20,18,16,.82);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px}
.vbody{padding:15px;display:flex;flex-direction:column;flex:1}
.vbody h3{margin:4px 0 6px;font-size:16px;line-height:1.45}
.vbody p{margin:0 0 10px;font-size:13px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.vcard.open .vbody p{display:block;overflow:visible}

/* 7. 文章見證卡片 */
section.group-sec{margin-top:26px}
section.group-sec h2{font-family:"Noto Serif TC","Songti TC",serif;font-size:22px;margin:0 0 14px;padding-left:12px;border-left:4px solid var(--accent)}
section.group-sec h2 small{font-family:"Noto Sans TC",sans-serif;font-size:14px;color:var(--sub);font-weight:400;margin-left:8px}

.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.top{display:grid;grid-template-columns:1fr 140px;gap:16px;align-items:start}
.top.nothumb{grid-template-columns:1fr}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.chead-left{display:flex;align-items:center;gap:8px}
.ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex:none}
.ico.post{background:#8A6B1E}.ico.video{background:var(--vid-badge)}.ico.biz{background:var(--biz-badge)}
.ctype{font-size:13px;font-weight:700;color:var(--sub)}
.meta{display:inline-block;background:var(--tag);color:var(--tagink);font-size:12px;font-weight:700;padding:2px 9px;border-radius:5px;margin:0 6px 6px 0}
.card h3{margin:0 0 6px;font-size:18px;line-height:1.5}
.txt{white-space:pre-line;margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card.open .txt{display:block;overflow:visible}

/* 精簡短標籤膠囊 */
.tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:12px;color:var(--tagink);background:var(--tag);border-radius:6px;padding:2px 10px;font-weight:700;cursor:pointer;transition:opacity .15s}
.tags span:hover{opacity:.8}

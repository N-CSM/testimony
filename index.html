<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>見證資料庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F4EF;
    --surface:#FFFFFF;
    --ink:#262521;
    --ink-soft:#736F66;
    --accent:#2F5C4C;
    --accent-dark:#204236;
    --accent-soft:#DCE8E1;
    --gold:#B8894A;
    --line:#E6E1D6;
    --danger:#B4483C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    line-height:1.6;
  }
  h1,h2,h3,.serif{ font-family:'Noto Serif TC', serif; }

  /* ---------- Header ---------- */
  header.top{
    position:sticky; top:0; z-index:40;
    background:rgba(246,244,239,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:18px 24px;
  }
  .top-inner{
    max-width:1080px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .mark{
    font-family:'Noto Serif TC', serif; font-size:28px; font-weight:700; color:var(--accent-dark);
    line-height:1;
  }
  .brand .sub{ font-size:12px; color:var(--ink-soft); letter-spacing:.05em; }
  #loginBtn{
    border:1px solid var(--accent); background:transparent; color:var(--accent);
    padding:8px 18px; border-radius:100px; font-size:14px; cursor:pointer;
    transition:.15s;
  }
  #loginBtn:hover{ background:var(--accent); color:#fff; }
  #loginBtn.active{ background:var(--accent); color:#fff; }

  /* ---------- Hero / search ---------- */
  .hero{
    max-width:1080px; margin:0 auto; padding:40px 24px 8px;
  }
  .hero h1{ font-size:26px; margin:0 0 6px; color:var(--ink); }
  .hero p{ margin:0 0 24px; color:var(--ink-soft); font-size:14px; }
  .search-box{
    position:relative;
    max-width:520px;
  }
  .search-box input{
    width:100%; padding:14px 18px 14px 44px; border-radius:12px;
    border:1px solid var(--line); background:var(--surface);
    font-size:15px; color:var(--ink);
  }
  .search-box input:focus{ outline:2px solid var(--accent-soft); border-color:var(--accent); }
  .search-box svg{ position:absolute; left:16px; top:50%; transform:translateY(-50%); opacity:.5; }

  /* ---------- Tag filters ---------- */
  .tag-section{ max-width:1080px; margin:0 auto; padding:20px 24px 6px; }
  .tag-group{ margin-bottom:14px; }
  .tag-group .cat-label{
    font-size:12px; color:var(--ink-soft); margin-right:12px; min-width:64px; display:inline-block;
  }
  .chip{
    display:inline-flex; align-items:center;
    border:1px solid var(--line); background:var(--surface);
    color:var(--ink); font-size:13px; padding:6px 14px;
    border-radius:100px; margin:4px 6px 4px 0; cursor:pointer;
    transition:.15s;
  }
  .chip:hover{ border-color:var(--accent); }
  .chip.selected{ background:var(--accent); border-color:var(--accent); color:#fff; }
  #clearTags{
    font-size:12px; color:var(--ink-soft); text-decoration:underline; cursor:pointer; margin-left:4px;
  }

  /* ---------- Results ---------- */
  .results-meta{
    max-width:1080px; margin:0 auto; padding:8px 24px 0; font-size:13px; color:var(--ink-soft);
  }
  .grid{
    max-width:1080px; margin:0 auto; padding:16px 24px 60px;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:18px;
  }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:20px; cursor:pointer; transition:.15s; position:relative;
    display:flex; flex-direction:column; gap:10px;
  }
  .card:hover{ border-color:var(--accent); transform:translateY(-2px); box-shadow:0 6px 18px rgba(47,92,76,0.08); }
  .card .quote-mark{
    font-family:'Noto Serif TC', serif; font-size:34px; color:var(--accent-soft); line-height:.6;
  }
  .card h3{ font-size:16px; margin:0; color:var(--ink); }
  .card .snippet{ font-size:13px; color:var(--ink-soft); flex:1;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .card .meta-row{ display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--ink-soft); }
  .card .tags-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .tag-pill{
    font-size:11px; background:var(--accent-soft); color:var(--accent-dark);
    padding:3px 10px; border-radius:100px;
  }
  .empty-state{
    max-width:1080px; margin:40px auto; padding:40px; text-align:center; color:var(--ink-soft);
  }

  /* ---------- Modal (detail) ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(38,37,33,0.55);
    display:none; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow-y:auto; z-index:100;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--surface); border-radius:16px; max-width:640px; width:100%;
    padding:32px; position:relative;
  }
  .modal .close-btn{
    position:absolute; top:18px; right:18px; border:none; background:none; font-size:22px; cursor:pointer; color:var(--ink-soft);
  }
  .modal h2{ font-size:20px; margin:0 0 4px; }
  .modal .modal-meta{ font-size:12px; color:var(--ink-soft); margin-bottom:16px; }
  .modal .content-text{ white-space:pre-wrap; font-size:14px; margin-bottom:18px; }
  .modal .shots{ display:flex; gap:10px; overflow-x:auto; margin-bottom:16px; }
  .modal .shots img{ height:220px; border-radius:10px; border:1px solid var(--line); }
  .modal a.source-link{ font-size:13px; color:var(--accent); }
  .modal .admin-actions{ margin-top:18px; border-top:1px solid var(--line); padding-top:14px; }

  /* ---------- Admin drawer ---------- */
  .drawer-overlay{
    position:fixed; inset:0; background:rgba(38,37,33,0.4);
    display:none; z-index:90;
  }
  .drawer-overlay.open{ display:block; }
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:min(460px,100%);
    background:var(--surface); z-index:95; box-shadow:-8px 0 24px rgba(0,0,0,0.08);
    transform:translateX(100%); transition:.25s ease; overflow-y:auto; padding:28px;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer h2{ font-size:19px; margin:0 0 18px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
  .field input[type=text], .field input[type=url], .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit;
  }
  .field textarea{ min-height:110px; resize:vertical; }
  .tag-picker .chip{ font-size:12px; }
  .file-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .file-row input[type=text]{ flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; }
  .file-row img{ width:44px; height:44px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
  #dropZone{
    border:1.5px dashed var(--line); border-radius:10px; padding:18px; text-align:center;
    font-size:13px; color:var(--ink-soft); cursor:pointer; margin-bottom:12px;
  }
  #dropZone:hover{ border-color:var(--accent); }
  .btn-primary{
    background:var(--accent); color:#fff; border:none; padding:12px 20px; border-radius:10px;
    font-size:14px; cursor:pointer; width:100%; margin-top:8px;
  }
  .btn-primary:hover{ background:var(--accent-dark); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:12px 22px; border-radius:100px; font-size:13px;
    z-index:200; display:none;
  }
  .toast.error{ background:var(--danger); }

  /* login mini form inside drawer trigger */
  .login-panel .field input{ margin-bottom:0; }

  @media (max-width:600px){
    .grid{ grid-template-columns:1fr; }
    .drawer{ width:100%; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="mark">見證資料庫</span>
      <span class="sub">超新星 · 真實故事典藏</span>
    </div>
    <button id="loginBtn">登入</button>
  </div>
</header>

<section class="hero">
  <h1>找到一段真實的改變</h1>
  <p>輸入關鍵字，或點選下方標籤，瀏覽已收錄的見證</p>
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="搜尋文字、見證者、標籤…" />
  </div>
</section>

<section class="tag-section" id="tagSection"></section>

<div class="results-meta" id="resultsMeta"></div>
<div class="grid" id="grid"></div>
<div class="empty-state" id="emptyState" style="display:none;">目前沒有符合的見證，換個關鍵字或標籤試試看</div>

<!-- 詳細內容 modal -->
<div class="overlay" id="detailOverlay">
  <div class="modal" id="detailModal"></div>
</div>

<!-- 登入 / 新增 側邊欄 -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="loginDrawer">
  <h2>管理員登入</h2>
  <div class="login-panel">
    <div class="field">
      <label>通關密碼</label>
      <input type="text" id="passwordInput" placeholder="輸入密碼" />
    </div>
    <button class="btn-primary" id="submitLogin">登入</button>
  </div>
</div>

<div class="drawer" id="addDrawer">
  <h2>新增見證</h2>
  <div class="field">
    <label>標題</label>
    <input type="text" id="f_title" placeholder="例如：長期偏頭痛終於好轉" />
  </div>
  <div class="field">
    <label>見證者名字</label>
    <input type="text" id="f_name" placeholder="可填暱稱，例如：三寶媽 Vivi" />
  </div>
  <div class="field">
    <label>見證文字</label>
    <textarea id="f_content" placeholder="貼上你複製的見證內容"></textarea>
  </div>
  <div class="field">
    <label>原始出處網址</label>
    <input type="url" id="f_source" placeholder="FB 貼文連結" />
  </div>
  <div class="field">
    <label>標籤（可複選，也可以直接新增）</label>
    <div class="tag-picker" id="tagPicker"></div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <input type="text" id="newTagInput" placeholder="新增標籤" style="flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;">
      <button type="button" id="addNewTagBtn" style="border:1px solid var(--line);background:none;border-radius:8px;padding:0 12px;cursor:pointer;">加入</button>
    </div>
  </div>
  <div class="field">
    <label>截圖上傳（可多張，上傳後可自訂每張描述文字，檔名會自動變成「編號_描述文字」方便之後對照）</label>
    <div id="dropZone">點擊或拖曳圖片到這裡上傳</div>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
    <div id="fileList"></div>
  </div>
  <div class="field">
    <label>備註（選填）</label>
    <textarea id="f_note" placeholder="脈絡、提供人、使用注意事項等"></textarea>
  </div>
  <button class="btn-primary" id="submitAdd">送出並更新到資料庫</button>
</div>

<div class="toast" id="toast"></div>

<script>
/*************** 設定：請把下面換成你部署後的 Apps Script 網址 ***************/
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyu2-ceMYAF_GaPbBBRAdahPi6pDfVJ6eEQfvWIn04Ee58fCZvVV-BS1zzh4PHbED1o3Q/exec';

/*************** 標籤分類 ***************/
const TAG_CATEGORIES = {
  '健康狀況': ['加護病房','敗血性休克','急救','癌症','中風','紅斑性狼瘡','免疫系統','手腳冰冷'],
  '體質調理': ['異膚','皮膚','好轉反應','高敏人','自律神經'],
  '婦科疼痛': ['婦科','疼痛'],
  '睡眠': ['睡眠'],
  '家庭照顧': ['長輩照顧','三寶媽','育兒','寵物照顧'],
  '事業人生': ['事業','翻轉人生','過勞','情緒'],
  '知識科普': ['電磁波','專業科普']
};
const ALL_TAGS = Object.values(TAG_CATEGORIES).flat();

/*************** 狀態 ***************/
let allData = [];
let selectedTag = null; // 瀏覽篩選：一次只能選一個標籤
let searchKeyword = '';
let selectedFormTags = new Set();
let uploadedFiles = []; // { file, base64, mimeType, label }
let authToken = sessionStorage.getItem('testimonyToken') || null;

/*************** 初始化 ***************/
document.addEventListener('DOMContentLoaded', () => {
  renderTagFilters();
  renderTagPicker();
  fetchData();
  updateLoginUI();

  document.getElementById('searchInput').addEventListener('input', e => {
    searchKeyword = e.target.value.trim().toLowerCase();
    render();
  });

  document.getElementById('loginBtn').addEventListener('click', () => {
    if (authToken) {
      openAddDrawer();
    } else {
      openDrawer('loginDrawer');
    }
  });

  document.getElementById('submitLogin').addEventListener('click', doLogin);
  document.getElementById('submitAdd').addEventListener('click', submitTestimony);

  document.getElementById('drawerOverlay').addEventListener('click', closeDrawers);
  document.getElementById('detailOverlay').addEventListener('click', e => {
    if (e.target.id === 'detailOverlay') closeModal();
  });

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); });
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', e => handleFiles(e.target.files));

  document.getElementById('addNewTagBtn').addEventListener('click', () => {
    const v = document.getElementById('newTagInput').value.trim();
    if (!v) return;
    selectedFormTags.add(v);
    if (!ALL_TAGS.includes(v)) ALL_TAGS.push(v);
    document.getElementById('newTagInput').value = '';
    renderTagPicker();
  });
});

/*************** 資料讀取 ***************/
function fetchData(){
  fetch(SCRIPT_URL + '?action=list')
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        allData = res.data;
        render();
      } else {
        showFetchError(res.message || '讀取失敗');
      }
    })
    .catch(err => {
      console.error('讀取見證資料失敗：', err);
      showFetchError('無法連線到資料庫，請確認 SCRIPT_URL 有沒有設定正確，或稍後再試一次');
    });
}

function showFetchError(msg){
  showToast(msg, true);
  const empty = document.getElementById('emptyState');
  empty.style.display = 'block';
  empty.innerHTML = `⚠️ ${escapeHtml(msg)}<br><span style="font-size:12px;">可以試著把這個網址貼到瀏覽器打開看看：<br>${escapeHtml(SCRIPT_URL)}?action=list</span>`;
  document.getElementById('resultsMeta').textContent = '';
  document.getElementById('grid').innerHTML = '';
}

/*************** 篩選 + 渲染卡片 ***************/
function renderTagFilters(){
  const el = document.getElementById('tagSection');
  el.innerHTML = '';
  Object.entries(TAG_CATEGORIES).forEach(([cat, tags]) => {
    const group = document.createElement('div');
    group.className = 'tag-group';
    const label = document.createElement('span');
    label.className = 'cat-label';
    label.textContent = cat;
    group.appendChild(label);
    tags.forEach(tag => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = tag;
      chip.onclick = () => {
        selectedTag = (selectedTag === tag) ? null : tag;
        renderTagFilters();
        render();
      };
      if (selectedTag === tag) chip.classList.add('selected');
      group.appendChild(chip);
    });
    el.appendChild(group);
  });
  if (selectedTag) {
    const clear = document.createElement('span');
    clear.id = 'clearTags';
    clear.textContent = '清除標籤篩選';
    clear.onclick = () => { selectedTag = null; renderTagFilters(); render(); };
    el.appendChild(clear);
  }
}

function getFilteredData(){
  return allData.filter(item => {
    const itemTags = (item['標籤'] || '').split(',').map(t => t.trim()).filter(Boolean);
    if (selectedTag && !itemTags.includes(selectedTag)) {
      return false;
    }
    if (searchKeyword) {
      const haystack = [item['標題'], item['見證者名字'], item['見證文字'], itemTags.join(' ')]
        .join(' ').toLowerCase();
      if (!haystack.includes(searchKeyword)) return false;
    }
    return true;
  }).sort((a,b) => Number(b['ID']) - Number(a['ID']));
}

function render(){
  const data = getFilteredData();
  const grid = document.getElementById('grid');
  const meta = document.getElementById('resultsMeta');
  const empty = document.getElementById('emptyState');
  empty.innerHTML = '目前沒有符合的見證，換個關鍵字或標籤試試看';
  meta.textContent = `共 ${data.length} 筆見證`;
  grid.innerHTML = '';
  empty.style.display = data.length ? 'none' : 'block';

  data.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    const tags = (item['標籤'] || '').split(',').map(t => t.trim()).filter(Boolean);
    card.innerHTML = `
      <div class="quote-mark">"</div>
      <h3>${escapeHtml(item['標題'] || '（未命名見證）')}</h3>
      <div class="snippet">${escapeHtml(item['見證文字'] || '')}</div>
      <div class="tags-row">${tags.map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join('')}</div>
      <div class="meta-row"><span>${escapeHtml(item['見證者名字'] || '匿名')}</span><span>${escapeHtml(item['新增日期'] || '')}</span></div>
    `;
    card.onclick = () => openDetail(item);
    grid.appendChild(card);
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/*************** 詳細內容 modal ***************/
function openDetail(item){
  const modal = document.getElementById('detailModal');
  const tags = (item['標籤'] || '').split(',').map(t => t.trim()).filter(Boolean);
  const shots = (item['截圖連結'] || '').split(',').map(s => s.trim()).filter(Boolean)
    .map(url => ({ display: driveViewToImg_(url), original: url }));

  modal.innerHTML = `
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <h2>${escapeHtml(item['標題'] || '（未命名見證）')}</h2>
    <div class="modal-meta">${escapeHtml(item['見證者名字'] || '匿名')} · ${escapeHtml(item['新增日期'] || '')}</div>
    <div class="tags-row" style="margin-bottom:14px;">${tags.map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join('')}</div>
    <div class="content-text">${escapeHtml(item['見證文字'] || '')}</div>
    ${shots.length ? `<div class="shots">${shots.map(s => `<img src="${s.display}" onclick="window.open('${s.original}','_blank')">`).join('')}</div>` : ''}
    ${item['原始出處網址'] ? `<a class="source-link" href="${item['原始出處網址']}" target="_blank">查看原始出處 →</a>` : ''}
    ${item['備註'] ? `<div style="margin-top:14px;font-size:13px;color:var(--ink-soft);">備註：${escapeHtml(item['備註'])}</div>` : ''}
    ${authToken ? `<div class="admin-actions"><button class="btn-primary" style="background:var(--danger);" onclick="deleteItem('${item['ID']}')">刪除這筆見證</button></div>` : ''}
  `;
  document.getElementById('detailOverlay').classList.add('open');
}
function closeModal(){ document.getElementById('detailOverlay').classList.remove('open'); }

// Google Drive 分享連結轉成可直接顯示的圖片網址
function driveViewToImg_(url){
  const match = url.match(/[-\w]{25,}/);
  if (match) return `https://drive.google.com/thumbnail?id=${match[0]}&sz=w1600`;
  return url;
}

/*************** 登入 ***************/
function updateLoginUI(){
  const btn = document.getElementById('loginBtn');
  if (authToken) {
    btn.textContent = '＋ 新增見證';
    btn.classList.add('active');
  } else {
    btn.textContent = '登入';
    btn.classList.remove('active');
  }
}

function doLogin(){
  const password = document.getElementById('passwordInput').value;
  fetch(SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type':'text/plain'},
    body: JSON.stringify({ action:'login', password })
  }).then(r => r.json()).then(res => {
    if (res.success) {
      authToken = res.token;
      sessionStorage.setItem('testimonyToken', authToken);
      closeDrawers();
      updateLoginUI();
      showToast('登入成功');
      render();
    } else {
      showToast(res.message || '登入失敗', true);
    }
  }).catch(() => showToast('連線失敗', true));
}

/*************** 新增見證表單 ***************/
function renderTagPicker(){
  const el = document.getElementById('tagPicker');
  el.innerHTML = '';
  ALL_TAGS.forEach(tag => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = tag;
    if (selectedFormTags.has(tag)) chip.classList.add('selected');
    chip.onclick = () => {
      if (selectedFormTags.has(tag)) selectedFormTags.delete(tag);
      else selectedFormTags.add(tag);
      renderTagPicker();
    };
    el.appendChild(chip);
  });
}

function handleFiles(fileList){
  Array.from(fileList).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    resizeImage(file, 1600, 0.8).then(({ base64, mimeType }) => {
      const label = `截圖${uploadedFiles.length + 1}`;
      uploadedFiles.push({ file, base64, mimeType, label });
      renderFileList();
    });
  });
}

function resizeImage(file, maxWidth, quality){
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderFileList(){
  const el = document.getElementById('fileList');
  el.innerHTML = '';
  uploadedFiles.forEach((f, i) => {
    const row = document.createElement('div');
    row.className = 'file-row';
    row.innerHTML = `
      <img src="data:${f.mimeType};base64,${f.base64}">
      <input type="text" value="${escapeHtml(f.label)}" placeholder="描述文字（會加在編號後面當檔名）">
      <span style="cursor:pointer;color:var(--ink-soft);" title="移除">&times;</span>
    `;
    row.querySelector('input').addEventListener('input', e => { f.label = e.target.value; });
    row.querySelector('span').addEventListener('click', () => { uploadedFiles.splice(i,1); renderFileList(); });
    el.appendChild(row);
  });
}

function submitTestimony(){
  const title = document.getElementById('f_title').value.trim();
  const testifierName = document.getElementById('f_name').value.trim();
  const content = document.getElementById('f_content').value.trim();
  const sourceUrl = document.getElementById('f_source').value.trim();
  const note = document.getElementById('f_note').value.trim();

  if (!content) { showToast('請至少填寫見證文字', true); return; }

  const btn = document.getElementById('submitAdd');
  btn.disabled = true; btn.textContent = '上傳中…';

  fetch(SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type':'text/plain'},
    body: JSON.stringify({
      action:'add',
      token: authToken,
      title, testifierName, content, sourceUrl, note,
      tags: [...selectedFormTags],
      images: uploadedFiles.map(f => ({ base64:f.base64, mimeType:f.mimeType, label:f.label }))
    })
  }).then(r => r.json()).then(res => {
    btn.disabled = false; btn.textContent = '送出並更新到資料庫';
    if (res.success) {
      showToast('新增成功！');
      resetForm();
      closeDrawers();
      fetchData();
    } else {
      showToast(res.message || '新增失敗', true);
    }
  }).catch(() => {
    btn.disabled = false; btn.textContent = '送出並更新到資料庫';
    showToast('連線失敗', true);
  });
}

function resetForm(){
  ['f_title','f_name','f_content','f_source','f_note'].forEach(id => document.getElementById(id).value = '');
  selectedFormTags.clear();
  uploadedFiles = [];
  renderTagPicker();
  renderFileList();
}

function deleteItem(id){
  if (!confirm('確定要刪除這筆見證嗎？截圖不會自動從 Drive 刪除，可以之後自行清理。')) return;
  fetch(SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ action:'delete', token: authToken, id })
  }).then(r=>r.json()).then(res => {
    if (res.success) {
      showToast('已刪除');
      closeModal();
      fetchData();
    } else {
      showToast(res.message || '刪除失敗', true);
    }
  });
}

/*************** 抽屜 / toast 共用 ***************/
function openDrawer(id){
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById(id).classList.add('open');
}
function openAddDrawer(){ openDrawer('addDrawer'); }
function closeDrawers(){
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('loginDrawer').classList.remove('open');
  document.getElementById('addDrawer').classList.remove('open');
}
function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2600);
}

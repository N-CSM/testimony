<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>負離子見證故事庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F2;
  --surface-ivory:#FDFBF7;
  --surface-gold:#F6EEDB;
  --surface-coffee:#2A211B;
  --card:#FFFFFF;
  --ink:#2C2420;
  --sub:#6E5D4F;
  --line:#E2D5C3;
  --accent:#B8920A;
  --accent-soft:rgba(184,146,10,.12);
  --tag:#F5E6B8;
  --tagink:#5C4608;
  --ph1:#E2D5C3;--ph2:#F5F0E8;
  --yt-color:#C4302B;
  --ig-grad:linear-gradient(135deg,#833AB4,#FD1D1D,#F56040);
  --biz-badge:#4F7A6A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#181411;--surface-ivory:#221C18;--surface-gold:#2C2419;--surface-coffee:#14100E;
    --card:#2A231E;--ink:#F5F0E8;--sub:#B9A98F;--line:#463B32;
    --accent:#D4AD3C;--accent-soft:rgba(212,173,60,.16);--tag:#4A3D18;--tagink:#F5E6B8;
    --ph1:#3D3530;--ph2:#2C2420;--yt-color:#E0524D;--biz-badge:#6FA18E;color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --bg:#181411;--surface-ivory:#221C18;--surface-gold:#2C2419;--surface-coffee:#14100E;
  --card:#2A231E;--ink:#F5F0E8;--sub:#B9A98F;--line:#463B32;
  --accent:#D4AD3C;--accent-soft:rgba(212,173,60,.16);--tag:#4A3D18;--tagink:#F5E6B8;
  --ph1:#3D3530;--ph2:#2C2420;--yt-color:#E0524D;--biz-badge:#6FA18E;color-scheme:dark
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.8;transition:background .2s,color .2s;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.wrap{max-width:1080px;margin:0 auto;padding:18px 18px 72px}

/* ==================== Hero 區塊 ==================== */
.hero{background:linear-gradient(135deg,var(--tag),var(--card) 68%);border:1px solid var(--line);border-radius:24px;padding:28px 30px;margin-bottom:14px;box-shadow:0 6px 24px rgba(44,36,32,.04)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.eyebrow-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eyebrow{color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.12em}
.date-pill{background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.hero h1{font-family:"Noto Serif TC","Songti TC",serif;font-size:clamp(25px,5vw,38px);margin:8px 0 6px;letter-spacing:.03em;line-height:1.25}
.lead{color:var(--sub);margin:0;max-width:720px;font-size:15.5px;line-height:1.7}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.stat-pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 13px;font-size:13px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.theme-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex:none}

/* ==================== 5. 置頂固定精簡「搜尋＋主題篩選」列 ==================== */
.sticky-bar{
  position:sticky;top:0;z-index:20;
  background:rgba(250,247,242,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:18px;
  padding:10px 14px;margin:0 0 18px;
  box-shadow:0 6px 20px rgba(44,36,32,.08);
}
:root[data-theme="dark"] .sticky-bar{background:rgba(24,20,17,.92)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sticky-bar{background:rgba(24,20,17,.92)}}

.sb-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sb-search{flex:1 1 200px;position:relative;display:flex;align-items:center}
.sb-search input{width:100%;padding:8px 32px 8px 13px;border:1px solid var(--line);border-radius:11px;background:var(--card);font-size:15px}
.sb-clear-q{position:absolute;right:8px;background:none;border:0;color:var(--sub);cursor:pointer;font-size:14px;padding:4px;display:none}
.sb-select{flex:1 1 170px;padding:8px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);font-size:15px;font-weight:700;cursor:pointer}
.sb-reset{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:8px 12px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}

.sb-subpills{display:flex;gap:6px;overflow-x:auto;padding-top:8px;margin-top:8px;border-top:1px dashed var(--line);scrollbar-width:none}
.sb-subpills::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 13px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

.typetabs{display:flex;gap:6px;overflow-x:auto;padding-top:8px;margin-top:8px;scrollbar-width:none}
.typetabs::-webkit-scrollbar{display:none}
.tt{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-weight:700;cursor:pointer;font-size:13.5px;white-space:nowrap;flex:none}
.tt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tt small{font-weight:400;opacity:.8;margin-left:4px;pointer-events:none}

/* ==================== 2. 三色交錯「換場」區塊樣式 ==================== */
.stage-sec{border-radius:24px;padding:24px 22px;margin:20px 0;border:1px solid var(--line);transition:background .2s}

/* 換場 A：淡象牙白 */
.stage-ivory{background:var(--surface-ivory)}
.stage-ivory .sec-title{font-family:"Noto Serif TC",serif;font-size:23px;color:var(--ink);border-left:5px solid var(--accent);padding-left:12px}
.stage-ivory .sec-badge{background:var(--accent);color:#fff}

/* 換場 B：淡金暖調 */
.stage-gold{background:var(--surface-gold);border-color:rgba(184,146,10,.35)}
.stage-gold .sec-title{font-family:"Noto Serif TC",serif;font-size:24px;color:#5C4608;border-left:5px solid #9A7605;padding-left:12px}
:root[data-theme="dark"] .stage-gold .sec-title{color:#F5E6B8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stage-gold .sec-title{color:#F5E6B8}}
.stage-gold .sec-badge{background:#8A6B1E;color:#fff}

/* 換場 C：深咖啡質感（重點影音與精選區） */
.stage-coffee{background:var(--surface-coffee);color:#F5F0E8;border-color:#4A3C31}
.stage-coffee .sec-title{font-family:"Noto Serif TC",serif;font-size:25px;color:#F7E5B2;border-left:5px solid #D4AD3C;padding-left:12px}
.stage-coffee .sec-sub{color:#C8B9A6}
.stage-coffee .sec-badge{background:#D4AD3C;color:#1F1712}
.stage-coffee .more{background:#3A2E26;color:#F5F0E8;border-color:#5C4B3E}

.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sec-title-wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-badge{font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:6px;letter-spacing:.05em}
.sec-title{margin:0;line-height:1.3}
.sec-sub{font-size:14px;color:var(--sub);font-weight:500}

/* ==================== 1. 影音橫向滑動牆 (Horizontal Snap Carousel) ==================== */
.h-scroll{
  display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:4px 2px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:thin
}
.h-scroll::-webkit-scrollbar{height:6px}
.h-scroll::-webkit-scrollbar-thumb{background:rgba(184,146,10,.35);border-radius:999px}

/* YouTube 橫向卡片 */
.yt-card{
  flex:0 0 min(320px,82vw);scroll-snap-align:start;
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;
  overflow:hidden;display:flex;flex-direction:column;cursor:pointer;
  transition:transform .16s,box-shadow .16s
}
.yt-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.14)}
.yt-thumb{position:relative;aspect-ratio:16/9;background:#181512;overflow:hidden;display:flex;align-items:center;justify-content:center}
.yt-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.yt-play{position:absolute;width:50px;height:36px;border-radius:10px;background:rgba(196,48,43,.92);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.yt-badge{position:absolute;top:9px;left:9px;background:rgba(0,0,0,.78);color:#fff;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px}
.yt-body{padding:14px 15px;display:flex;flex-direction:column;flex:1;min-width:0}
.yt-body h3{margin:0 0 6px;font-size:16.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.yt-body p{margin:0 0 10px;font-size:14px;line-height:1.6;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}

/* IG Reels 橫向卡片 */
.ig-card{
  flex:0 0 min(210px,56vw);scroll-snap-align:start;
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;
  overflow:hidden;display:flex;flex-direction:column;cursor:pointer;
  transition:transform .16s
}
.ig-card:hover{transform:translateY(-3px)}
.ig-thumb{position:relative;aspect-ratio:9/14;background:var(--ig-grad);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center;color:#fff}
.ig-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ig-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.12) 55%,rgba(0,0,0,.25) 100%)}
.ig-pill{position:absolute;top:9px;left:9px;z-index:2;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.ig-play-circle{position:relative;z-index:2;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.26);border:2px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.ig-overlay-title{position:absolute;bottom:10px;left:11px;right:11px;z-index:2;color:#fff;font-size:14.5px;font-weight:700;line-height:1.4;text-align:left;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ig-body{padding:11px 12px;display:flex;flex-direction:column;flex:1;min-width:0}

/* 近期更新橫向小卡 */
.rcard{
  flex:0 0 min(260px,76vw);scroll-snap-align:start;
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;
  padding:15px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;min-width:0
}
.rcard:hover{border-color:var(--accent)}
.rcard-top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px}
.badge-new{background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.badge-fmt{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--sub)}
.rcard h4{margin:0 0 6px;font-size:16px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.rcard p{margin:0 0 10px;font-size:14px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}

/* ==================== 6 & 11. 圖文與事業卡片（重點引言＋下方全寬照片） ==================== */
.post-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(460px,100%),1fr));gap:16px}
.card{
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;
  padding:20px;display:flex;flex-direction:column;cursor:pointer;min-width:0;
  transition:transform .16s,border-color .16s,box-shadow .16s
}
.card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 20px rgba(44,36,32,.07)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chead-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex:none}
.ico.post{background:#8A6B1E}.ico.biz{background:var(--biz-badge)}
.ctype{font-size:13.5px;font-weight:700;color:var(--sub)}
.meta{display:inline-block;background:var(--tag);color:var(--tagink);font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:5px}

.card h3{margin:0 0 10px;font-size:19px;line-height:1.45;overflow-wrap:anywhere;word-break:break-word}

/* 重點引言區塊 */
.pull-quote{
  margin:0 0 12px;padding:10px 14px;
  background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;
  font-family:"Noto Serif TC",serif;font-size:16.5px;font-weight:700;line-height:1.6;
  color:var(--ink);overflow-wrap:anywhere;word-break:break-word
}
.txt-preview{
  margin:0;font-size:15.5px;line-height:1.75;color:var(--sub);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:anywhere;word-break:break-word
}

/* 卡片底部全寬照片預覽列 */
.card-photos{display:flex;gap:8px;margin-top:14px;overflow:hidden}
.card-photo-item{position:relative;flex:1 1 0;max-width:140px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--ph2)}
.card-photo-item img{width:100%;height:100%;object-fit:cover;display:block}
.th-count{position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center}

.card-foot{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.tags span{font-size:12.5px;color:var(--tagink);background:var(--tag);border-radius:6px;padding:2px 9px;font-weight:700;cursor:pointer}
.read-more-cue{font-size:13.5px;font-weight:700;color:var(--accent);white-space:nowrap}

.more{display:block;margin:16px auto 0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 26px;cursor:pointer;font-size:14.5px;font-weight:700}
.empty{color:var(--sub);padding:36px 16px;text-align:center;font-size:16px;background:var(--card);border-radius:18px;border:1px solid var(--line)}
.loader{text-align:center;padding:48px 20px;color:var(--sub);font-size:16px}
.note{margin:18px 0;padding:14px 16px;border:1px dashed var(--accent);border-radius:12px;font-size:13.5px;line-height:1.7;color:var(--sub)}

/* ==================== 3. 彈出式閱讀視窗 (Reader Modal) ==================== */
.overlay{position:fixed;inset:0;background:rgba(15,12,10,.82);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.overlay.on{display:flex}

.reader-box{
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:22px;
  max-width:680px;width:100%;max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 20px 50px rgba(0,0,0,.45);overflow:hidden
}
.reader-head{
  padding:14px 20px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg)
}
.reader-close{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 15px;font-size:14px;font-weight:700;cursor:pointer}
.reader-scroll{padding:22px 24px 32px;overflow-y:auto;line-height:1.9;font-size:16.5px;overflow-wrap:anywhere;word-break:break-word}
.reader-scroll h2{font-family:"Noto Serif TC",serif;font-size:23px;line-height:1.4;margin:8px 0 14px}
.reader-body{white-space:pre-line;margin:0 0 18px}
.inline-link{color:var(--accent);text-decoration:underline;word-break:break-all;font-weight:600}

.reader-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:16px 0}
.ph{position:relative;aspect-ratio:4/3;border:1px solid var(--line);border-radius:10px;cursor:zoom-in;padding:0;overflow:hidden;background:var(--bg)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.reader-meta-box{margin-top:16px;padding:12px 15px;background:var(--bg);border-radius:12px;font-size:14.5px;color:var(--sub)}
.vlink-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:10px;background:var(--yt-color);color:#fff;text-decoration:none;font-size:15px;font-weight:700;margin-bottom:14px}

/* ==================== 10. 多張照片燈箱（左右滑動＋長按存圖） ==================== */
#lb{z-index:50;flex-direction:column;gap:12px;user-select:none}
.lb-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;z-index:52}
.lb-counter{background:rgba(0,0,0,.65);color:#fff;padding:5px 13px;border-radius:999px;font-size:14px;font-weight:700}
#x{padding:7px 16px;border-radius:999px;border:0;background:#fff;color:#222;font-weight:700;cursor:pointer}
.lb-stage{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
/* 保持原生 img 可長按存圖 */
#bigImg{max-width:min(920px,94vw);max-height:78vh;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);object-fit:contain;-webkit-touch-callout:default}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
  border:0;background:rgba(255,255,255,.88);color:#222;font-size:22px;font-weight:900;
  cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:52;box-shadow:0 4px 12px rgba(0,0,0,.3)
}
#lbPrev{left:12px}
#lbNext{right:12px}
.lb-tip{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);color:rgba(255,255,255,.8);font-size:13px;background:rgba(0,0,0,.55);padding:4px 14px;border-radius:999px}

/* ==================== 管理員編輯視窗 ==================== */
.mbox{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;padding:22px}
.mbox h3{margin:0 0 14px;font-size:19px}
.mfield{margin-bottom:14px}
.mfield label{display:block;font-size:14px;font-weight:700;margin-bottom:5px;color:var(--sub)}
.mfield input[type="text"],.mfield textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.macts{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.btn-save{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 20px;font-size:15px;font-weight:700;cursor:pointer}
.admin-btn{border:1px solid var(--accent);background:var(--tag);color:var(--tagink);border-radius:7px;padding:4px 11px;font-size:13px;font-weight:700;cursor:pointer}
.sleep-badge{background:var(--biz-badge);color:#fff;font-size:12px;padding:2px 8px;border-radius:5px}

@media(max-width:640px){
  .wrap{padding:12px 10px 64px}
  .hero{padding:18px 16px;border-radius:20px}
  .sticky-bar{border-radius:14px;padding:9px 10px}
  .stage-sec{padding:18px 14px;border-radius:20px;margin:16px 0}
  .card{padding:16px 15px}
  .card h3{font-size:19px}
  .pull-quote{font-size:16px;padding:9px 12px}
  .txt-preview{font-size:16px}
  .reader-box{max-height:92vh;border-radius:18px}

<script>

// 燈箱狀態

var EMO = {
  "睡眠":"😴","頭面五官":"👁️","肩頸腰背":"🦴","四肢與關節":"🦵",
  "循環與體質代謝":"💜","呼吸與消化系統":"🫁","婦科與泌尿循環":"🌸",
  "皮膚與外在修護":"✨","身心情緒與高敏":"🌿","特定族群照護":"🐾",
  "緊急狀況／疑難雜症":"🏥","事業與人生轉型":"🚀","綜合保養":"🌱","待分類":"🏷️"
};
var ORDER = Object.keys(EMO);

function esc(s){
  return String(s || "").replace(/[&<>"']/g, function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];
  });
}

function linkifyText(s){
  var safe = esc(s);
  return safe.replace(/(https?:\/\/[^\s<>"'）)】」』]+)/g, function(url){
    return '<a class="inline-link" href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
  });
}

// 擷取文章第一句作為重點引言
function extractQuote(r){
  var text = String(r.x || "").trim();
  if(!text) return "";
  var lines = text.split(/\n+/).map(function(l){ return l.trim(); }).filter(function(l){
    return l.length >= 6 && !/^https?:\/\//i.test(l) && !/^#/.test(l);
  });
  var first = lines[0] || text;
  var sent = first.split(/[。！？!?]/)[0].trim();
  var candidate = (sent.length >= 8 && sent.length <= 55) ? sent : first.slice(0, 52);
  if(candidate === r.t) return "";
  return candidate + (candidate.length < first.length ? "⋯" : "");
}

/* ==================== 深淺色手動切換 ==================== */
(function initTheme(){
  var saved = localStorage.getItem("nefful_theme");
  var btn = document.getElementById("themeToggle");
  function apply(theme){
    if(theme === "dark"){
      document.documentElement.setAttribute("data-theme", "dark");
      btn.textContent = "☀️ 淺色模式";
    } else if(theme === "light"){
      document.documentElement.setAttribute("data-theme", "light");
      btn.textContent = "🌙 深色模式";
    } else {
      var isSysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      btn.textContent = isSysDark ? "☀️ 淺色模式" : "🌙 深色模式";
    }
  }
  apply(saved);
  btn.addEventListener("click", function(){
    var curTheme = document.documentElement.getAttribute("data-theme");
    var isSysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = (curTheme === "dark" || (!curTheme && isSysDark)) ? "light" : "dark";
    localStorage.setItem("nefful_theme", next);
    apply(next);
  });
})();

/* ==================== 模式初始化 ==================== */
if(APP_MODE === "sleep"){
  CATS = ["全部", "YouTube 影音", "IG Reels 短影音", "圖文見證"];
  document.getElementById("eyebrowTxt").textContent = "NEFFUL ・ 睡眠與生活體驗專區";
  document.getElementById("pageTitle").textContent = "負離子睡眠與日常體驗集";
  document.getElementById("pageLead").textContent = "精選真實睡眠品質提升與日常健康保養故事分享。";
} else if(APP_MODE === "admin"){
  document.getElementById("eyebrowTxt").textContent = "NEFFUL ・ 管理員審核模式";
  document.getElementById("liveBadge").textContent = "ADMIN 編輯權限已啟用";
}

function gname(t){ return String(t).split("：")[0].trim(); }
function sname(t){ var p = String(t).split("："); return p[1] ? p[1].trim() : ""; }

function getSectionType(r){
  if(r.c === "事業見證") return "事業故事";
  if(r.k === "video"){
    if(r.vType === "IG" || r.vFmt === "portrait") return "IG Reels 短影音";
    return "YouTube 影音";
  }
  return "圖文見證";
}

function match(r, skipCat){
  if(!skipCat && cur !== "全部" && getSectionType(r) !== cur) return false;
  if(grp){
    var hitGrp = (r.g || []).some(function(t){
      return gname(t) === grp && (!sub || sname(t) === sub);
    });
    if(!hitGrp) return false;
  }
  if(kw){
    var hay = (r.t + " " + r.x + " " + (r.g || []).join(" ") + " " + r.prod + " " + r.sharer).toLowerCase();
    if(hay.indexOf(kw) < 0) return false;
  }
  return true;
}

function adminControls(r){
  if(APP_MODE !== "admin") return "";
  return (r.pub.indexOf("sleep") > -1 ? '<span class="sleep-badge">sleep</span> ' : '') +
         '<button class="admin-btn" data-edit="' + r.rowNum + '">✎ 編輯</button>';
}

function renderShortTags(gArr){
  if(!gArr || !gArr.length) return "";
  return '<div class="tags">' + gArr.map(function(g){
    var p0 = gname(g), p1 = sname(g);
    var shortName = p1 || p0;
    return '<span data-grp="' + esc(p0) + '" data-sub="' + esc(p1) + '">#' + esc(shortName) + '</span>';
  }).join("") + '</div>';
}

/* ==================== 卡片樣板（點擊一律開啟閱讀視窗） ==================== */
function ytCard(r){

        '<div>' + adminControls(r) + '</div>' +
      '</div>' +
      '<h3>' + esc(r.t) + '</h3>' +

function igCard(r){

function postCard(r){
  var isBiz = r.c === "事業見證";
  var quote = extractQuote(r);

  // 底部照片列（最多預覽 3 張，超過顯示 +N）

function openReader(id){

/* ==================== 10. 多張照片燈箱控制（左右滑動＋按鈕＋鍵盤） ==================== */
function openLightbox(storyId, startIdx){
  var r = DATA.find(function(x){ return String(x.id) === String(storyId); });
  if(!r || !r.p || !r.p.length) return;
  LB_LIST = r.p;
  LB_IDX = Math.max(0, Math.min(startIdx, LB_LIST.length - 1));
  updateLightboxView();
  document.getElementById("lb").classList.add("on");
}

function updateLightboxView(){
  if(!LB_LIST.length) return;
  var img = document.getElementById("bigImg");
  img.src = LB_LIST[LB_IDX].full;
  document.getElementById("lbCounter").textContent = (LB_IDX + 1) + " / " + LB_LIST.length;
  var showNav = LB_LIST.length > 1 ? "flex" : "none";
  document.getElementById("lbPrev").style.display = showNav;
  document.getElementById("lbNext").style.display = showNav;
}

function stepLightbox(delta){
  if(LB_LIST.length <= 1) return;
  LB_IDX = (LB_IDX + delta + LB_LIST.length) % LB_LIST.length;
  updateLightboxView();
}

// 手指左右滑動偵測（超過 40px 才切換，完全不干擾長按下載圖片）
var lbStage = document.getElementById("lbStage");
lbStage.addEventListener("touchstart", function(e){
  if(e.touches && e.touches.length === 1) touchStartX = e.touches[0].clientX;
}, {passive: true});
lbStage.addEventListener("touchend", function(e){
  if(!touchStartX || !e.changedTouches || !e.changedTouches.length) return;
  var diffX = e.changedTouches[0].clientX - touchStartX;
  touchStartX = 0;
  if(Math.abs(diffX) > 40){
    stepLightbox(diffX < 0 ? 1 : -1);
  }
}, {passive: true});

/* ==================== 13. 動態精選（混合不同類型，每次換新感） ==================== */
function buildDynamicHighlights(){
  if(!DATA.length){ RECENT_PICKS = []; return; }
  // 混合圖文、事業、影音各挑最新或隨機精選，避免全被最後4支影片佔滿
  var posts = DATA.filter(function(r){ return getSectionType(r) === "圖文見證"; });
  var biz = DATA.filter(function(r){ return getSectionType(r) === "事業故事"; });
  var vids = DATA.filter(function(r){ return r.k === "video"; });

  var pool = [];
  if(posts[0]) pool.push(posts[0]);
  if(biz[0]) pool.push(biz[0]);
  if(vids[0]) pool.push(vids[0]);
  if(posts[1]) pool.push(posts[1]);

  // 補滿 4 則
  for(var i = 0; i < DATA.length && pool.length < 4; i++){
    if(pool.indexOf(DATA[i]) === -1) pool.push(DATA[i]);
  }
  RECENT_PICKS = pool;
}

function applyGroups(groups){
  if(!groups || !groups.length) return;
  groups.forEach(function(x){ EMO[x.g] = x.e || EMO[x.g] || "📄"; });
  ORDER = groups.map(function(x){ return x.g; });
}

function render(){
  var stageThemes = ["stage-ivory", "stage-coffee", "stage-gold"];
  var stageIdx = 0;
  var h = "";

  // 0. 無篩選條件時，頂部顯示「精選焦點（橫向滑動）」
  var isFiltering = Boolean(grp || sub || kw || cur !== "全部");
  if(!isFiltering && RECENT_PICKS.length){
    h += '<section class="stage-sec ' + stageThemes[stageIdx++ % 3] + '">' +
      '<div class="sec-head">' +
        '<div class="sec-title-wrap"><span class="sec-badge">FEATURED</span><h2 class="sec-title">精選見證焦點</h2></div>' +
        '<span class="sec-sub">左右滑動 · 點擊閱讀</span>' +
      '</div>' +
      '<div class="h-scroll">' + RECENT_PICKS.map(function(r){
        var firstTag = r.g && r.g[0] ? (sname(r.g[0]) || gname(r.g[0])) : r.c;
        return '<div class="rcard" data-open="' + r.id + '">' +
          '<div><div class="rcard-top"><span class="badge-new">精選</span><span class="badge-fmt">' + esc(getSectionType(r)) + '</span></div>' +
          '<h4>' + esc(r.t) + '</h4>' +
          '<p>' + esc(r.x) + '</p></div>' +
          '<span class="meta" style="align-self:flex-start">#' + esc(firstTag) + '</span>' +
        '</div>';
      }).join("") + '</div></section>';
  }

  // 1. 各大分類區塊（三色交錯換場 + 預設 4 則）
  var activeSections = CATS.slice(1);
  activeSections.forEach(function(secName){
    var rows = DATA.filter(function(r){ return getSectionType(r) === secName && match(r); });
    if(!rows.length) return;

    var isHorizontal = (secName === "YouTube 影音" || secName === "IG Reels 短影音");
    var defaultLim = isHorizontal ? 6 : LIM;
    var n = shown[secName] || defaultLim;
    var themeCls = stageThemes[stageIdx++ % 3];

    h += '<section class="stage-sec ' + themeCls + '">' +
      '<div class="sec-head">' +
        '<div class="sec-title-wrap"><span class="sec-badge">' + (isHorizontal ? 'SWIPE ⇄' : 'STORIES') + '</span>' +
        '<h2 class="sec-title">' + TABI[secName] + secName + ' <span class="sec-sub">（' + rows.length + ' 則）</span></h2></div>' +
        (isHorizontal ? '<span class="sec-sub">← 左右滑動瀏覽 →</span>' : '') +
      '</div>';

    if(secName === "YouTube 影音"){
      h += '<div class="h-scroll">' + rows.slice(0, n).map(ytCard).join("") + '</div>';
    } else if(secName === "IG Reels 短影音"){
      h += '<div class="h-scroll">' + rows.slice(0, n).map(igCard).join("") + '</div>';
    } else {
      h += '<div class="post-grid">' + rows.slice(0, n).map(postCard).join("") + '</div>';
    }

    if(rows.length > n){
      h += '<button class="more" data-more="' + esc(secName) + '">看更多' + esc(secName) + '（還有 ' + (rows.length - n) + ' 則）</button>';
    }
    h += '</section>';
  });

  if(!h){
    h = '<div class="empty">目前的篩選條件沒有符合的內容。<br><br><button class="sb-reset" id="emptyReset">清除篩選，看全部內容</button></div>';
  }
  document.getElementById("out").innerHTML = h;

  // 更新置頂篩選列狀態
  var cn = {"全部": DATA.filter(function(r){ return match(r, true); }).length};
  activeSections.forEach(function(secName){
    cn[secName] = DATA.filter(function(r){ return getSectionType(r) === secName && match(r, true); }).length;
  });

  document.getElementById("cats").innerHTML = CATS.filter(function(c){ return c === "全部" || c === cur || cn[c] > 0; }).map(function(c){
    return '<button class="tt" aria-pressed="' + (c === cur) + '" data-c="' + esc(c) + '">' + TABI[c] + esc(c) + '<small>' + cn[c] + '</small></button>';
  }).join("");

  // 統計大類與子類數量
  var gs = {}, sb = {};
  DATA.forEach(function(r){
    var seen = {};
    (r.g || []).forEach(function(t){
      var g = gname(t), s = sname(t);
      if(!g) return;
      if(!seen[g]){ seen[g] = 1; gs[g] = (gs[g] || 0) + 1; }
      if(s){ sb[g] = sb[g] || {}; sb[g][s] = (sb[g][s] || 0) + 1; }
    });
  });

  var gk = Object.keys(gs).sort(function(a, b){
    var x = ORDER.indexOf(a), y = ORDER.indexOf(b);
    return (x < 0 ? 99 : x) - (y < 0 ? 99 : y);
  });

  var sel = document.getElementById("grpSelect");
  sel.innerHTML = '<option value="">📌 全部狀況主題（' + DATA.length + ' 則）</option>' +
    gk.map(function(g){
      return '<option value="' + esc(g) + '"' + (g === grp ? ' selected' : '') + '>' + (EMO[g] || "📄") + ' ' + esc(g) + '（' + gs[g] + '）</option>';
    }).join("");

  var sk = grp && sb[grp] ? Object.keys(sb[grp]).sort(function(a, b){ return sb[grp][b] - sb[grp][a]; }) : [];
  var subBox = document.getElementById("subs");
  subBox.style.display = sk.length ? "flex" : "none";
  subBox.innerHTML = sk.length
    ? '<button class="pill" aria-pressed="' + (!sub) + '" data-s="">全部' + esc(grp) + '</button>' +
      sk.map(function(x){
        return '<button class="pill" aria-pressed="' + (x === sub) + '" data-s="' + esc(x) + '">' + esc(x) + ' · ' + sb[grp][x] + '</button>';
      }).join("")
    : "";

  // Hero 數據膠囊
  var ytCnt = DATA.filter(function(r){ return getSectionType(r) === "YouTube 影音"; }).length;
  var igCnt = DATA.filter(function(r){ return getSectionType(r) === "IG Reels 短影音"; }).length;
  var postCnt = DATA.filter(function(r){ return getSectionType(r) === "圖文見證"; }).length;
  var bizCnt = DATA.filter(function(r){ return getSectionType(r) === "事業故事"; }).length;

  document.getElementById("stats").innerHTML = [
    '<span class="stat-pill">📚 總收錄 ' + DATA.length + ' 則</span>',
    '<span class="stat-pill">💬 圖文 ' + postCnt + '</span>',
    '<span class="stat-pill">🎬 YouTube ' + ytCnt + '</span>',
    '<span class="stat-pill">📱 Reels ' + igCnt + '</span>',
    (bizCnt ? '<span class="stat-pill">🚀 事業 ' + bizCnt + '</span>' : '')
  ].join("");
}

/* ==================== 事件監聽 ==================== */
document.addEventListener("click", function(e){
  var b;

  // 1. 優先處理編輯按鈕（避免觸發開啟閱讀視窗）
  if(b = e.target.closest("[data-edit]")){
    e.stopPropagation();
    openAdminEditor(Number(b.dataset.edit));
    return;
  }

  // 2. 優先處理標籤膠囊篩選
  if(b = e.target.closest("[data-grp]")){
    e.stopPropagation();
    document.getElementById("readerModal").classList.remove("on");
    cur = "全部";
    grp = b.dataset.grp || "";
    sub = b.dataset.sub || "";
    render();
    window.scrollTo({top: 0, behavior: "smooth"});
    return;
  }

  // 3. 點擊照片開啟多圖燈箱
  if(b = e.target.closest("[data-lb-story]")){
    e.stopPropagation();
    openLightbox(b.dataset.lbStory, Number(b.dataset.lbIdx || 0));
    return;
  }

  // 4. 點擊卡片開啟彈出式閱讀視窗
  if(b = e.target.closest("[data-open]")){
    // 若點擊的是卡片內的超連結則直接外開
    if(e.target.closest("a")) return;
    openReader(b.dataset.open);
    return;
  }

  if(b = e.target.closest("[data-c]")){
    cur = b.dataset.c;
    render();
    return;
  }
  if(b = e.target.closest("[data-s]")){
    var clickedSub = b.dataset.s;
    sub = (sub === clickedSub) ? "" : clickedSub;
    render();
    return;
  }
  if(b = e.target.closest("[data-more]")){
    var sec = b.dataset.more;
    var step = (sec === "YouTube 影音" || sec === "IG Reels 短影音") ? 6 : LIM;
    shown[sec] = (shown[sec] || step) + step;
    render();
    return;
  }
  if(e.target.closest("#reset") || e.target.closest("#emptyReset")){
    cur = "全部"; grp = ""; sub = ""; kw = "";
    document.getElementById("q").value = "";
    document.getElementById("clearQ").style.display = "none";
    render();
    return;
  }

  // 關閉閱讀視窗
  if(e.target.id === "rClose" || e.target.id === "readerModal"){
    document.getElementById("readerModal").classList.remove("on");
    return;
  }

  // 燈箱控制
  if(e.target.id === "lbPrev"){ stepLightbox(-1); return; }
  if(e.target.id === "lbNext"){ stepLightbox(1); return; }
  if(e.target.id === "x" || e.target.id === "lb" || e.target.id === "lbStage"){
    document.getElementById("lb").classList.remove("on");
    return;
  }

  // 管理員編輯標籤選擇
  if(b = e.target.closest("[data-picktag]")){
    var tagVal = b.getAttribute("data-picktag");
    var inp = document.getElementById("mTags");
    var arr = inp.value.split(/[,，]\s*/).map(function(s){ return s.trim(); }).filter(Boolean);
    var pos = arr.indexOf(tagVal);
    if(pos > -1){ arr.splice(pos, 1); b.setAttribute("aria-pressed", "false"); }
    else { arr.push(tagVal); b.setAttribute("aria-pressed", "true"); }
    inp.value = arr.join(", ");
    return;
  }
  if(e.target.id === "mCancel" || e.target.id === "modal"){
    document.getElementById("modal").classList.remove("on");
  }
});

function openAdminEditor(rn){
  var item = DATA.find(function(x){ return x.rowNum === rn; });
  if(!item) return;
  editingRow = item;
  document.getElementById("mTitleInput").value = item.t || "";
  document.getElementById("mRawBody").value = item.rawX || item.x || "";
  document.getElementById("mSleep").checked = item.pub.indexOf("sleep") > -1;

  var curList = (item.g || []).filter(function(x){ return x !== "待分類"; });
  document.getElementById("mTags").value = curList.join(", ");

  var pickerHtml = Object.keys(TAG_TREE).map(function(g){
    var pills = (TAG_TREE[g] || []).map(function(s){
      var full = g + "：" + s;
      var active = curList.indexOf(full) > -1;
      return '<button type="button" class="pill" style="font-size:13px;padding:4px 11px" aria-pressed="' + active + '" data-picktag="' + esc(full) + '">' + esc(s) + '</button>';
    }).join(" ");
    return '<div style="margin-bottom:8px"><div style="font-size:13px;font-weight:700;color:var(--sub);margin-bottom:4px">' + (EMO[g] || "📄") + ' ' + esc(g) + '</div><div style="display:flex;gap:6px;flex-wrap:wrap">' + pills + '</div></div>';
  }).join("");
  document.getElementById("mTagPicker").innerHTML = pickerHtml || '<span style="font-size:13px;color:var(--sub)">尚未建立「標籤清單」分頁，可直接於下方輸入框填寫。</span>';

  document.getElementById("mComp").value = item.compX || "";
  document.getElementById("modal").classList.add("on");
}

document.getElementById("mSave").addEventListener("click", function(){
  if(!editingRow) return;
  var btn = document.getElementById("mSave");
  btn.disabled = true; btn.textContent = "儲存中...";

  var payload = {
    rowNum: editingRow.rowNum,
    title: document.getElementById("mTitleInput").value.trim(),
    rawX: document.getElementById("mRawBody").value.trim(),
    pub: document.getElementById("mSleep").checked ? "sleep" : "",
    customTags: document.getElementById("mTags").value.trim(),
    compX: document.getElementById("mComp").value.trim()
  };

  fetch(GAS_API_URL, {
    method: "POST",
    body: JSON.stringify(payload)
  })
  .then(function(r){ return r.json(); })
  .then(function(res){
    btn.disabled = false; btn.textContent = "儲存至試算表";
    if(!res.ok) throw new Error(res.error || "儲存失敗");
    document.getElementById("modal").classList.remove("on");
    document.getElementById("readerModal").classList.remove("on");
    loadData();
  })
  .catch(function(err){
    btn.disabled = false; btn.textContent = "儲存至試算表";
    alert("儲存失敗：" + err.message);
  });
});

// 置頂篩選列事件
document.getElementById("grpSelect").addEventListener("change", function(e){
  grp = e.target.value;
  sub = "";
  cur = "全部";
  render();
});

var qInp = document.getElementById("q");
var clearQBtn = document.getElementById("clearQ");
qInp.addEventListener("input", function(e){
  kw = e.target.value.trim().toLowerCase();
  clearQBtn.style.display = kw ? "block" : "none";
  render();
});
clearQBtn.addEventListener("click", function(){
  qInp.value = "";
  kw = "";
  clearQBtn.style.display = "none";
  render();
});

// 鍵盤支援（ESC 關閉視窗、左右鍵切換燈箱照片）
document.addEventListener("keydown", function(e){
  var lbOn = document.getElementById("lb").classList.contains("on");
  if(lbOn){
    if(e.key === "ArrowLeft") stepLightbox(-1);
    else if(e.key === "ArrowRight") stepLightbox(1);
    else if(e.key === "Escape") document.getElementById("lb").classList.remove("on");
    return;
  }
  if(e.key === "Escape"){
    document.getElementById("modal").classList.remove("on");
    document.getElementById("readerModal").classList.remove("on");
  }
});

document.addEventListener("error", function(e){
  var t = e.target;
  if(!t || t.tagName !== "IMG") return;

  var src = t.getAttribute("src") || "";
  var step = Number(t.dataset.retry || 0);

  // 擷取 Google Drive 檔案 ID
  var m = src.match(/\/d\/([a-zA-Z0-9_-]+)/) || src.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(m && m[1] && step < 2){
    var fid = m[1];
    t.dataset.retry = String(step + 1);
    if(step === 0){
      // 第一備援：改用 Drive 縮圖轉檔引擎（支援 HEIC 轉 JPG）
      t.src = "https://drive.google.com/thumbnail?id=" + fid + "&sz=w1000";
      return;
    } else if(step === 1){
      // 第二備援：改用標準 uc 檢視串流
      t.src = "https://drive.google.com/uc?export=view&id=" + fid;
      return;
    }
  }

  t.style.visibility = "hidden";
  if(t.parentNode) t.parentNode.classList.add("imgfail");
}, true);

function loadData(){
  var apiEndpoint = GAS_API_URL + "?api=1&mode=" + encodeURIComponent(APP_MODE);
  fetch(apiEndpoint)
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(!res.ok) throw new Error(res.error || "載入失敗");
      applyGroups(res.groups);
      TAG_TREE = res.catalog || {};
      DATA = res.data || [];
      buildDynamicHighlights();
      render();
    })
    .catch(function(err){
      document.getElementById("out").innerHTML = '<div class="empty">資料載入失敗：' + esc(err.message) +
        '<br><br><button class="sb-reset" onclick="loadData()">重新載入</button></div>';
    });
}
loadData();
</script>
